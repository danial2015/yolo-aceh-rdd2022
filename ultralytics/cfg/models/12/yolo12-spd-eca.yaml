# YOLO12s with space-to-depth convolution (SPD-Conv) downsampling and Efficient Channel Attention (ECA-Net).
# SPDConv replaces the P3, P4 and P5 stride-two backbone convolutions. ECA is applied to P3 only.

# Parameters
nc: 80 # number of classes
scales:
  # [depth, width, max_channels]
  s: [0.50, 0.50, 1024]

# YOLO12s-SPD-ECA backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, SPDConv, [256, 3]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, ECAAttention, []] # 5-P3/8
  - [-1, 1, SPDConv, [512, 3]] # 6-P4/16
  - [-1, 4, A2C2f, [512, True, 4]]
  - [-1, 1, SPDConv, [1024, 3]] # 8-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]]

# YOLO12s-SPD-ECA head
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 7], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, A2C2f, [512, False, -1]] # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, A2C2f, [256, False, -1]] # 15

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]] # cat head P4
  - [-1, 2, A2C2f, [512, False, -1]] # 18

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]] # cat backbone P5
  - [-1, 2, C3k2, [1024, True]] # 21 (P5/32-large)

  - [[15, 18, 21], 1, Detect, [nc]] # Detect(P3, P4, P5)
