# YOLO12s with direct EMA attention after final fused P3/P4 and selective GhostConv on the bottom-up head.
# The backbone and native A2C2f modules are unchanged from YOLO12s.

nc: 80 # number of classes
scale: s
scales:
  # [depth, width, max_channels]
  s: [0.50, 0.50, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]]
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]] # 8

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # 10: concatenate backbone P4
  - [-1, 2, A2C2f, [512, False, -1]] # 11: top-down P4

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # 13: concatenate backbone P3
  - [-1, 2, A2C2f, [256, False, -1]] # 14: final fused P3
  - [-1, 1, EMA, [32]] # 15: direct EMA on final P3

  - [-1, 1, GhostConv, [256, 3, 2]] # 16: selective P3 -> P4 downsampling
  - [[-1, 11], 1, Concat, [1]] # 17: concatenate top-down P4
  - [-1, 2, A2C2f, [512, False, -1]] # 18: final fused P4
  - [-1, 1, EMA, [32]] # 19: direct EMA on final P4

  - [-1, 1, GhostConv, [512, 3, 2]] # 20: selective P4 -> P5 downsampling
  - [[-1, 8], 1, Concat, [1]] # 21: concatenate backbone P5
  - [-1, 2, C3k2, [1024, True]] # 22: final P5

  - [[15, 19, 22], 1, Detect, [nc]] # Detect(P3, P4, P5)
