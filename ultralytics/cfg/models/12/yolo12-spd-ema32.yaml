# YOLO12-Small with SPD-Conv downsampling at P3/P4/P5 and one near-identity residual EMA-32 at P3/8.
# SPDConv requires image sizes divisible by 32. EMA-32 requires the P3 channel count to be divisible by 32.

nc: 80 # number of classes
scales:
  # [depth, width, max_channels]
  s: [0.50, 0.50, 1024]

# YOLO12s-SPD-EMA32 backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, SPDConv, [256, 3]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, EMAAttention, [32, 0.001]] # 5-P3/8: residual scale starts near identity
  - [-1, 1, SPDConv, [512, 3]] # 6-P4/16
  - [-1, 4, A2C2f, [512, True, 4]] # 7-P4/16
  - [-1, 1, SPDConv, [1024, 3]] # 8-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]] # 9-P5/32

# YOLO12s head. Indices after the EMA insertion shift by one.
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 7], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, A2C2f, [512, False, -1]] # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 5], 1, Concat, [1]] # cat EMA-refined P3
  - [-1, 2, A2C2f, [256, False, -1]] # 15

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 12], 1, Concat, [1]] # cat head P4
  - [-1, 2, A2C2f, [512, False, -1]] # 18

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 9], 1, Concat, [1]] # cat backbone P5
  - [-1, 2, C3k2, [1024, True]] # 21

  - [[15, 18, 21], 1, Detect, [nc]] # Detect(P3, P4, P5)
