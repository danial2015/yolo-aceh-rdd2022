# YOLO12-Small with space-to-depth convolution (SPD-Conv) at P3, P4 and P5 downsampling.
# Each SPDConv applies PixelUnshuffle(2), then a stride-one Conv. Input images must be divisible by 32.

nc: 80 # number of classes
scales:
  # [depth, width, max_channels]
  s: [0.50, 0.50, 1024]

# YOLO12s-SPD backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]
  - [-1, 1, SPDConv, [256, 3]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4-P3/8
  - [-1, 1, SPDConv, [512, 3]] # 5-P4/16
  - [-1, 4, A2C2f, [512, True, 4]] # 6-P4/16
  - [-1, 1, SPDConv, [1024, 3]] # 7-P5/32
  - [-1, 4, A2C2f, [1024, True, 1]] # 8-P5/32

# Original YOLO12s head; layer indices are unchanged because SPDConv replaces Conv in place.
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]] # cat backbone P4
  - [-1, 2, A2C2f, [512, False, -1]] # 11

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]] # cat backbone P3
  - [-1, 2, A2C2f, [256, False, -1]] # 14

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 11], 1, Concat, [1]] # cat head P4
  - [-1, 2, A2C2f, [512, False, -1]] # 17

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 8], 1, Concat, [1]] # cat backbone P5
  - [-1, 2, C3k2, [1024, True]] # 20

  - [[14, 17, 20], 1, Detect, [nc]] # Detect(P3, P4, P5)
